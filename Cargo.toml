[package]
name = "mt5-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "纯 Rust 实现的 MetaTrader 5 IPC 通信库（消息模式 / 并发保护 / 超时保护 / 多终端发现 / 异步下单）"
license = "MIT"
repository = "https://github.com/Norma-H-R/Mt5-rs-Core"
documentation = "https://github.com/Norma-H-R/Mt5-rs-Core"
readme = "README.md"
keywords = ["metatrader", "mt5", "trading", "forex", "ipc"]
categories = ["api-bindings", "finance"]
# 上游：yjkt <mpbgp@qq.com>（https://github.com/yjkt/mt5-rs，MIT）
authors = ["Anjou <2940629930@qq.com>"]

[features]
# GUI 调试工具示例（examples/gui.rs）所需。
# 默认关闭：构建库本体、运行其它示例（如 pipe_features）都不会拉 eframe 依赖树。
# 用法：cargo run --example gui --features gui
gui = ["dep:eframe"]
# 为 types 中的数据结构实现 serde::Serialize（默认关闭；监控/仪表盘等需要 JSON 输出时开启）。
# 用法：mt5-rs = { path = "...", features = ["serde"] }
serde = ["dep:serde"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
# 可选：为数据结构实现 Serialize（feature = "serde"）
serde = { version = "1", features = ["derive"], optional = true }
# 仅 examples/gui.rs（API 调试 GUI）使用，可选开启：
#   cargo run --example gui --features gui
# 注意：eframe 0.24+ 需要较新的 rustc（本机 1.98 满足）；
# 若要用旧工具链构建，可降回 eframe = "0.23"（但 0.23 在部分工具链上编译失败）。
eframe = { version = "0.31", optional = true }

[lib]
name = "mt5_rs"
path = "src/lib.rs"

# GUI 示例需要显式启用 gui feature（未启用时该示例被跳过，不参与构建）
[[example]]
name = "gui"
required-features = ["gui"]
